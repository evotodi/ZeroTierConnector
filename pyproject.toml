[tool.poetry]
name = "zerotier-connector"
version = "0.1.1"
description = "CLI helper to pick ZeroTier members and open SSH sessions."
authors = ["evotodi"]
readme = "README.md"
packages = [{ include = "zerotier_connector", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.0"
pydantic = "^2.10.0"
click = "^8.1.7"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"

[tool.poetry.scripts]
zerotier-connector = "zerotier_connector.main:Main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
