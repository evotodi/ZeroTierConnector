[project]
name = "zerotier-connector"
version = "0.1.1"
description = "CLI helper to pick ZeroTier members and open SSH sessions."
authors = [{ name = "evotodi" }]
requires-python = ">=3.13,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.32.0,<3",
    "pydantic>=2.10.0,<3",
    "click>=8.1.7,<9",
]

[project.scripts]
zerotier-connector = "zerotier_connector.main:Main"

[dependency-groups]
dev = ["ruff>=0.9.0,<0.10"]

[tool.uv]
default-groups = "all"

[tool.hatch.build.targets.sdist]
include = ["src/zerotier_connector"]

[tool.hatch.build.targets.wheel]
include = ["src/zerotier_connector"]

[tool.hatch.build.targets.wheel.sources]
"src/zerotier_connector" = "zerotier_connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
